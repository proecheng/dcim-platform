version: 1

# Run at most three deployments at once. Increase only after registry, network,
# database, and control-host capacity have been measured.
concurrency: 3
report_directory: ../../_bmad-output/test-artifacts/epic-39/39.7/fleet-reports
state_directory: ../../../dcim-fleet-state

defaults:
  compose_file: docker-compose.story-39-7-preprod.yml
  platform: linux/amd64
  e2e:
    headed: true
    browser_channel: msedge
    specs:
      - e2e/auth.spec.ts
      - e2e/invalid-detail-pages.spec.ts
      - e2e/authorization-matrix.spec.ts
      - e2e/site-isolation-websocket-authorization.spec.ts
  dr:
    compose_file: ../dr/docker-compose.dr.yml
    project_name: dcim-story-39-3-dr
    canonical_runtime_image: ghcr.io/proecheng/dcim-platform/postgres:16.15-ts2.29.1-pgb2.59.0-runtime@sha256:e6ca69c005bfba5b30dbb91c58a181874e2c833e0a311ad3998f32d4b497f3e4
    final_runtime_image: ghcr.io/proecheng/dcim-platform/postgres:16.15-ts2.29.1-pgb2.59.0-schema-gate-v1@sha256:ad57905638f480f574c1955bf433e5414ddf8158a4a5f76ad2ee7d5e683e0f76
    schema_application_image: ghcr.io/proecheng/dcim-platform/backend@sha256:58bb47905f93872fb4be2817c22d600f10fa60432dcd20f59405a7e149f22bcd
    repository_volume: dcim-story-39-3-dr-pgbackrest

targets:
  # Docker Desktop must be switched to Linux containers. This target is also
  # the control host, so Playwright can use the published loopback port.
  - name: workstation
    docker_context: desktop-linux
    env_file: ../../../dcim-fleet-secrets/workstation.env
    project_name: dcim-story-39-7-workstation
    dr:
      mode: local
      secret_directory: ../../../dcim-fleet-secrets/workstation/dr
    e2e:
      mode: local
      local_port: 3000

  # Remote Docker contexts use SSH. Playwright remains on the control host and
  # reaches each remote loopback listener through a unique SSH tunnel.
  - name: qa-linux-01
    docker_context: qa-linux-01
    env_file: ../../../dcim-fleet-secrets/qa-linux-01.env
    project_name: dcim-story-39-7-qa-01
    dr:
      mode: ssh
      ssh_target: deploy@qa-linux-01.example.invalid
      remote_directory: /opt/dcim/story-39-3
      secret_directory: ../../../dcim-fleet-secrets/qa-linux-01/dr
    e2e:
      mode: ssh-tunnel
      ssh_target: deploy@qa-linux-01.example.invalid
      local_port: 13001
      remote_port: 3000

  - name: qa-linux-02
    docker_context: qa-linux-02
    env_file: ../../../dcim-fleet-secrets/qa-linux-02.env
