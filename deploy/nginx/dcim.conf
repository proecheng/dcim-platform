# DCIM nginx 反向代理配置
# 功能：HTTPS 终止 + WebSocket(WSS) 转发 + HTTP→HTTPS 重定向
#
# 部署步骤：
# 1. 将此文件复制到 /etc/nginx/conf.d/dcim.conf
# 2. 申请 SSL 证书（见下方说明）
# 3. nginx -t && systemctl reload nginx
#
# SSL 证书申请（二选一）：
#   方式A - Let's Encrypt（推荐，自动续期）：
#     certbot certonly --nginx -d dcim.powerlab.cn
#     证书路径自动填入 /etc/letsencrypt/live/dcim.powerlab.cn/
#
#   方式B - 如果域名已有证书，修改下方 ssl_certificate 路径即可

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name dcim.powerlab.cn;

    # Let's Encrypt 验证路径（申请证书时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主配置 ──
server {
    listen 443 ssl http2;
    server_name dcim.powerlab.cn;

    # ── SSL 证书 ──
    # Let's Encrypt 路径（certbot 自动生成）
    ssl_certificate     /etc/letsencrypt/live/dcim.powerlab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dcim.powerlab.cn/privkey.pem;

    # ── SSL 安全参数 ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全头 ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ── 日志 ──
    access_log /var/log/nginx/dcim_access.log;
    error_log  /var/log/nginx/dcim_error.log;

    # ── WebSocket 转发（关键！解决 WSS 连接问题）──
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade 必需头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（默认 60s 太短）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API 转发 ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 超时
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Swagger 文档 ──
    location /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # ── 静态文件（前端）──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
