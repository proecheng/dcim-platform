listen_addresses = '*'
shared_preload_libraries = 'timescaledb'
password_encryption = 'scram-sha-256'

wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/pgbackrest-wrapper --stanza=dcim archive-push %p'
archive_timeout = 60s
max_wal_senders = 6
max_replication_slots = 4
max_slot_wal_keep_size = 10GB
wal_keep_size = 1GB
wal_log_hints = on
full_page_writes = on
hot_standby = on

logging_collector = on
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
