listen_addresses = ''
port = 5432
unix_socket_directories = '/var/run/postgresql'
shared_preload_libraries = 'timescaledb'

archive_mode = off
wal_level = replica
hot_standby = on
full_page_writes = on

logging_collector = on
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
