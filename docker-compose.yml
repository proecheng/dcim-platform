version: '3.8'

services:
  # ─── PostgreSQL + TimescaleDB ───────────────────────────────
  postgres:
    image: dcim-postgres:16.15-ts2.29.1-pgb2.59.0
    build:
      context: .
      dockerfile: deploy/postgres-backup/Dockerfile
    container_name: dcim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcim}
      POSTGRES_USER: ${POSTGRES_USER:-dcim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcim} -d ${POSTGRES_DB:-dcim}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dcim-network

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dcim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dcim-network

  # ─── EMQX MQTT Broker ──────────────────────────────────────
  emqx:
    image: emqx/emqx:5
    container_name: dcim-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: dcim-emqx
      EMQX_HOST: 0.0.0.0
    ports:
      - "${MQTT_PORT:-1883}:1883"        # MQTT TCP
      - "${MQTT_WS_PORT:-8083}:8083"     # MQTT WebSocket
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"  # EMQX Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dcim-network

  # ─── 后端 FastAPI ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:?VCS_REF is required}
    container_name: dcim-backend
    restart: unless-stopped
    environment:
      # 应用
      APP_NAME: ${APP_NAME:-算力中心智能监控系统}
      APP_VERSION: "3.0.0"
      APP_ENV: production
      DEBUG: "false"
      # 数据库 — PostgreSQL + TimescaleDB
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dcim}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dcim}
      TIMESCALEDB_ENABLED: ${TIMESCALEDB_ENABLED:-true}
      # JWT
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # CORS — Nginx 在同一网络内，允许外部访问地址
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Redis
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      # MQTT
      MQTT_ENABLED: "true"
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY:?GATEWAY_SECRET_KEY is required}
      VPP_API_KEY: ${VPP_API_KEY:?VPP_API_KEY is required}
      LICENSE_KEY: ${LICENSE_KEY:?LICENSE_KEY is required}
      FAULT_TREE_HMAC_KEY: ${FAULT_TREE_HMAC_KEY:?FAULT_TREE_HMAC_KEY is required}
      # 数据采集
      SEED_ENABLED: "false"
      DEMO_ENABLED: "false"
      SIMULATION_ENABLED: "false"
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-10}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
      MAX_POINTS: ${MAX_POINTS:-100}
      BACKUP_STATUS_DIR: /var/lib/dcim-dr-status
      OBSERVABILITY_STATE_PATH: /var/lib/dcim-observability/state.json
    volumes:
      - dr-status:/var/lib/dcim-dr-status:ro
      - observability-state:/var/lib/dcim-observability
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - dcim-network

  # ─── 前端 Nginx ─────────────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:?VCS_REF is required}
    container_name: dcim-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dcim-network

volumes:
  postgres-data:
    name: dcim-postgres-data
  redis-data:
    name: dcim-redis-data
  emqx-data:
    name: dcim-emqx-data
  dr-status:
    external: true
    name: ${DCIM_DR_STATUS_VOLUME:-dcim-story-39-3-dr_dr-status}
  observability-state:
    name: dcim-observability-state

networks:
  dcim-network:
    name: dcim-network
    driver: bridge
