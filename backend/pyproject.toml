[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E711",  # comparison to None (SQLAlchemy uses == None)
    "E712",  # comparison to True/False (SQLAlchemy filter patterns)
    "E402",  # module level import not at top (intentional in large modules)
    "E741",  # ambiguous variable name (false positive on list comprehensions)
    "F811",  # redefinition of unused name (intentional schema overrides)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
