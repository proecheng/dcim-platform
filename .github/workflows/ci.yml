name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Ruff 代码检查
        run: ruff check app/

      - name: Ruff 格式检查
        run: ruff format --check app/

      - name: Python 编译检查
        run: python -m compileall app -q

      - name: 运行测试
        run: |
          pytest tests/ \
            --ignore=tests/test_asset_import.py \
            --ignore=tests/test_asset_lifecycle_warranty.py \
            --ignore=tests/test_bacnet_ip_adapter.py \
            --ignore=tests/test_cabinet_usage.py \
            --ignore=tests/test_capacity_monitoring.py \
            --ignore=tests/test_communication_monitor.py \
            --ignore=tests/test_config_push.py \
            --ignore=tests/test_connection_test.py \
            --ignore=tests/test_device_detail.py \
            --ignore=tests/test_device_status_board.py \
            --ignore=tests/test_dry_contact.py \
            --ignore=tests/test_gateway.py \
            --ignore=tests/test_gateway_api.py \
            --ignore=tests/test_gateway_registration.py \
            --ignore=tests/test_http_rest_adapter.py \
            --ignore=tests/test_modbus_rtu.py \
            --ignore=tests/test_modbus_tcp.py \
            --ignore=tests/test_mqtt_adapter.py \
            --ignore=tests/test_offline_cache.py \
            --ignore=tests/test_opc_ua_adapter.py \
            --ignore=tests/test_password_policy.py \
            --ignore=tests/test_point_data.py \
            --ignore=tests/test_point_import.py \
            --ignore=tests/test_snmp.py \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: 依赖安全扫描 (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc || echo "::warning::发现依赖安全漏洞，请检查并修复"

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 14

  frontend-checks:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint 代码检查
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build

  e2e-critical:
    name: 关键 E2E 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 E2E 依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 启动后端
        working-directory: backend
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > ../backend-ci.log 2>&1 &

      - name: 启动前端
        working-directory: frontend
        run: nohup npm run dev -- --host 127.0.0.1 --port 3000 > ../frontend-ci.log 2>&1 &

      - name: 等待服务就绪
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "后端日志:"
          cat backend-ci.log || true
          echo "前端日志:"
          cat frontend-ci.log || true
          exit 1

      - name: 运行关键 E2E
        run: npx playwright test e2e/auth.spec.ts e2e/authorization-matrix.spec.ts e2e/invalid-detail-pages.spec.ts --project=chromium

      - name: 上传 E2E 诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            backend-ci.log
            frontend-ci.log
            e2e/test-results
          retention-days: 14
