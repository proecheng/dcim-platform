name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: |
          pytest tests/ \
            --ignore=tests/test_bacnet_ip_adapter.py \
            --ignore=tests/test_config_push.py \
            --ignore=tests/test_connection_test.py \
            --ignore=tests/test_dry_contact.py \
            --ignore=tests/test_gateway.py \
            --ignore=tests/test_gateway_registration.py \
            --ignore=tests/test_http_rest_adapter.py \
            --ignore=tests/test_modbus_rtu.py \
            --ignore=tests/test_modbus_tcp.py \
            --ignore=tests/test_mqtt_adapter.py \
            --ignore=tests/test_offline_cache.py \
            --ignore=tests/test_opc_ua_adapter.py \
            --ignore=tests/test_point_data.py \
            --ignore=tests/test_snmp.py \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 14

  frontend-checks:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 类型检查
        run: npm run typecheck
